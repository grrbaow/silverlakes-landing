<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SilverLakes -- Strategically Accessible</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f0ede8; }
  #map { width: 100%; height: 100vh; }

  /* SilverLakes permanent label */
  .sl-label {
    font-family: 'Segoe UI', system-ui, sans-serif;
    white-space: nowrap;
    pointer-events: none;
  }
  .sl-name {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #b8860b;
    display: block;
    text-shadow: 0 0 6px #fff, 0 0 3px #fff;
  }
  .sl-sub {
    font-size: 10px;
    font-weight: 600;
    color: #555;
    display: block;
    margin-top: 1px;
    text-shadow: 0 0 4px #fff, 0 0 2px #fff;
  }

  /* Dot styles */
  .dot-city      { width:7px;  height:7px;  background:#444;    border:1.5px solid #fff; border-radius:50%; cursor:pointer; }
  .dot-county    { width:5px;  height:5px;  background:#aaa;    border:1px solid #fff;   border-radius:50%; cursor:pointer; }
  .dot-airport   { width:11px; height:11px; background:#c9a84c; border:2px solid #fff;   border-radius:50%; box-shadow:0 1px 5px rgba(0,0,0,0.3); cursor:pointer; }
  .dot-sl        { width:36px; height:36px; background:transparent; }

  /* Popup overrides */
  .leaflet-popup-content-wrapper {
    border-radius: 6px;
    padding: 0;
    box-shadow: 0 3px 14px rgba(0,0,0,0.2);
  }
  .leaflet-popup-content {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .popup-inner {
    padding: 10px 14px;
    min-width: 140px;
  }
  .popup-name {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #1a1a1a;
    display: block;
    margin-bottom: 3px;
  }
  .popup-sub {
    font-size: 11px;
    color: #888;
    display: block;
  }
  .popup-airport .popup-name { color: #9a6c00; }
  .leaflet-popup-tip { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', {
  zoomControl: true,
  scrollWheelZoom: true,
  attributionControl: true
}).setView([33.82, -117.85], 8);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap contributors © CARTO',
  subdomains: 'abcd',
  maxZoom: 16
}).addTo(map);

map.createPane('labels');
map.getPane('labels').style.zIndex = 650;
map.getPane('labels').style.pointerEvents = 'none';

// SilverLakes -- permanent star + label
L.marker([33.9530944, -117.5540374], {
  icon: L.divIcon({
    className: '',
    html: '<svg width="36" height="36" viewBox="0 0 36 36"><polygon points="18,2 21.8,13.5 34,13.5 24,20.5 27.5,32 18,25.5 8.5,32 12,20.5 2,13.5 14.2,13.5" fill="#c9a84c" stroke="#fff" stroke-width="1.5"/></svg>',
    iconAnchor: [18, 18]
  }),
  zIndexOffset: 2000
}).addTo(map);

L.marker([33.9530944, -117.5540374], {
  icon: L.divIcon({
    className: '',
    html: '<div class="sl-label"><span class="sl-name">SilverLakes</span><span class="sl-sub">1.4M annual visitors</span></div>',
    iconAnchor: [-12, 6]
  }),
  pane: 'labels',
  zIndexOffset: 3000
}).addTo(map);

// Helper: dot marker with hover popup
function addDot(latlng, dotClass, popupClass, name, sub) {
  var popup = L.popup({
    closeButton: false,
    offset: [0, -4],
    className: 'clean-popup'
  }).setContent(
    '<div class="popup-inner ' + popupClass + '">' +
    '<span class="popup-name">' + name + '</span>' +
    (sub ? '<span class="popup-sub">' + sub + '</span>' : '') +
    '</div>'
  );

  var marker = L.marker(latlng, {
    icon: L.divIcon({
      className: '',
      html: '<div class="' + dotClass + '"></div>',
      iconAnchor: [dotClass === 'dot-airport' ? 5 : dotClass === 'dot-city' ? 3 : 2,
                   dotClass === 'dot-airport' ? 5 : dotClass === 'dot-city' ? 3 : 2]
    }),
    zIndexOffset: 100
  }).addTo(map);

  marker.on('mouseover', function() { this.openPopup(); });
  marker.on('mouseout',  function() { this.closePopup(); });
  marker.on('click',     function() { this.openPopup(); });
  marker.bindPopup(popup);
}

// Cities
addDot([34.055691,  -118.2487702], 'dot-city', '', 'Downtown Los Angeles', '49.1M annual visitors');
addDot([33.8232286, -116.5106191], 'dot-city', '', 'Palm Springs', null);

// Counties
addDot([33.65,  -116.1],  'dot-county', '', 'Riverside County',      'pop. 2.5 million');
addDot([34.5,   -116.4],  'dot-county', '', 'San Bernardino County', 'pop. 2.2 million');
addDot([33.55,  -117.72], 'dot-county', '', 'Orange County',         'pop. 3.2 million');
addDot([33.05,  -116.5],  'dot-county', '', 'San Diego County',      'pop. 3.3 million');

// Airports
addDot([33.942153,  -118.4036052], 'dot-airport', 'popup-airport', 'LAX',               '73.7M passengers/yr');
addDot([34.0559976, -117.5980922], 'dot-airport', 'popup-airport', 'Ontario Intl (ONT)', '7.1M passengers/yr');
addDot([33.674687,  -117.8692422], 'dot-airport', 'popup-airport', 'John Wayne (SNA)',   '11.3M passengers/yr');
addDot([33.8161064, -118.1512558], 'dot-airport', 'popup-airport', 'Long Beach (LGB)',   '4.2M passengers/yr');
</script>
</body>
</html>
