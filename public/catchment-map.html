<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SilverLakes Catchment Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f8f8f6;
    color: #1a1a1a;
    height: 100vh;
    overflow: hidden;
  }

  #map {
    width: 100%;
    height: 100vh;
  }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const CENTER = [33.9530944, -117.5540374];
  const MILES_TO_METERS = 1609.34;

  const map = L.map('map', {
    zoomControl: true,
    scrollWheelZoom: true,
    attributionControl: false
  }).setView(CENTER, 7);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    maxZoom: 14
  }).addTo(map);

  const rings = [
    { miles: 90, color: '#D85A30', label: '<strong>90-mile radius</strong><br>22.1M people<br><span style="color:#888;font-size:12px">SoCal + San Diego + IE</span>', dash: '6 4' },
    { miles: 60, color: '#1D9E75', label: '<strong>60-mile radius</strong><br>14.8M people<br><span style="color:#888;font-size:12px">Greater Los Angeles DMA</span>', dash: null },
    { miles: 30, color: '#378ADD', label: '<strong>30-mile radius</strong><br>4.2M people<br><span style="color:#888;font-size:12px">Inland Empire + East LA</span>', dash: null },
  ];

  rings.forEach(r => {
    L.circle(CENTER, {
      radius: r.miles * MILES_TO_METERS,
      color: r.color,
      weight: 2,
      fillColor: r.color,
      fillOpacity: 0.07,
      dashArray: r.dash
    }).addTo(map).bindPopup(r.label, { maxWidth: 200 });
  });

  const pinIcon = L.divIcon({
    html: `<div style="
      width: 14px; height: 14px;
      background: #15606C;
      border: 2.5px solid #fff;
      border-radius: 50%;
      box-shadow: 0 1px 6px rgba(0,0,0,0.35);
    "></div>`,
    className: '',
    iconAnchor: [7, 7]
  });

  L.marker(CENTER, { icon: pinIcon })
    .addTo(map)
    .bindPopup(`
      <strong style="font-size:13px">SilverLakes Equestrian &amp; Sports Park</strong><br>
      <span style="color:#666;font-size:12px">5555 Hamner Ave, Norco, CA</span>
    `, { maxWidth: 220 })
    .openPopup();
</script>
</body>
</html>
